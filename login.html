<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Lafeau</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <button onclick="window.history.back()">Go back</button>
    <div class="login-container">
        <form class="login-form" id="loginForm">
            <h2>🔐 Beheerpaneel</h2>
            <p class="login-subtitle">Lafeau Juwelieren - Admin Toegang</p>
            
            <div class="form-group">
                <label for="username" class="required">Gebruikersnaam</label>
                <input type="text" id="username" required placeholder="Voer gebruikersnaam in">
                <div class="error-message" id="usernameError"></div>
            </div>
            
            <div class="form-group">
                <label for="password" class="required">Wachtwoord</label>
                <input type="password" id="password" required placeholder="Voer wachtwoord in">
                <div class="error-message" id="passwordError"></div>
            </div>
            
            <button type="submit" class="btn-primary login-btn">
                <span id="btnText">Inloggen</span>
                <span id="btnLoading" style="display: none;">⏳ Bezig...</span>
            </button>
            
            <div class="error-message" id="generalError"></div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
